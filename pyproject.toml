[project]
name = "turnos-ga"
version = "0.1.0"
description = "Servicio que asigna turnos semanales con un algoritmo genético (Unidad 4)"
requires-python = ">=3.12"
# Dependencias de EJECUCIÓN del servicio desplegado. Deliberadamente
# mínimas: es lo único que instala la imagen de Docker.
dependencies = [
    "fastapi",
    "numpy",
    "pygad",
    "uvicorn[standard]",
]

[dependency-groups]
# Herramientas de desarrollo: pruebas, linting, notebooks. Nunca se
# instalan en el servicio desplegado.
dev = [
    "httpx2>=2.16.0",
    "pytest",
    "ruff",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/turnos_ga"]

[tool.pytest.ini_options]
pythonpath = ["src"]

[tool.ruff]
line-length = 88
