<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Turnos GA</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 640px; margin: 0 auto; padding: 16px; color: #1f2937; background: #f9fafb; }
    h1 { font-size: 1.4rem; margin-bottom: 4px; }
    p.sub { margin-top: 0; color: #6b7280; }
    label { display: block; font-weight: 600; margin-top: 12px; }
    textarea, input { width: 100%; box-sizing: border-box; padding: 8px; font-size: 1rem; border: 1px solid #d1d5db; border-radius: 6px; }
    .fila { display: grid; grid-template-columns: 1fr 1fr; gap: 0 12px; }
    button { margin-top: 16px; width: 100%; padding: 12px; font-size: 1rem; font-weight: 600; color: #fff; background: #2563eb; border: 0; border-radius: 6px; }
    button:disabled { background: #93c5fd; }
    .estado { margin-top: 16px; padding: 10px; border-radius: 6px; }
    .ok { background: #dcfce7; } .mal { background: #fee2e2; }
    table { width: 100%; border-collapse: collapse; margin-top: 12px; background: #fff; }
    th, td { text-align: left; padding: 6px; border-bottom: 1px solid #e5e7eb; font-size: 0.95rem; }
  </style>
</head>
<body>
  <h1>Turnos GA</h1>
  <p class="sub">Arma el horario semanal de tu equipo con un algoritmo genético.</p>

  <form id="form">
    <label for="personas">Personas (una por línea)</label>
    <textarea id="personas" rows="7">Ana
Beto
Carla
Dani
Eva
Fede
Gabi</textarea>

    <div class="fila">
      <div><label for="dias">Días</label><input id="dias" type="number" min="1" max="7" value="7"></div>
      <div><label for="turnos_por_dia">Turnos por día</label><input id="turnos_por_dia" type="number" min="1" max="3" value="2"></div>
      <div><label for="personas_por_turno">Personas por turno</label><input id="personas_por_turno" type="number" min="1" value="3"></div>
      <div><label for="max_turnos_por_persona">Máximo por persona</label><input id="max_turnos_por_persona" type="number" min="1" value="6"></div>
    </div>

    <label for="clave">API key</label>
    <input id="clave" type="password" autocomplete="off">

    <button id="boton" type="submit">Generar horario</button>
  </form>

  <div id="resultado"></div>

  <script>
    const form = document.getElementById("form");
    const boton = document.getElementById("boton");
    const salida = document.getElementById("resultado");
    const numero = (id) => Number(document.getElementById(id).value);

    form.addEventListener("submit", async (evento) => {
      evento.preventDefault();
      boton.disabled = true;
      boton.textContent = "Buscando horario...";
      salida.innerHTML = "";

      const solicitud = {
        personas: document.getElementById("personas").value.split("\n").map((n) => n.trim()).filter(Boolean),
        dias: numero("dias"),
        turnos_por_dia: numero("turnos_por_dia"),
        personas_por_turno: numero("personas_por_turno"),
        max_turnos_por_persona: numero("max_turnos_por_persona"),
      };

      try {
        const respuesta = await fetch("/horario", {
          method: "POST",
          headers: { "Content-Type": "application/json", "X-API-Key": document.getElementById("clave").value },
          body: JSON.stringify(solicitud),
        });
        const datos = await respuesta.json();
        if (!respuesta.ok) {
          const detalle = typeof datos.detail === "string" ? datos.detail : datos.detail.map((d) => d.msg).join("; ");
          mostrarError(`Error ${respuesta.status}: ${detalle}`);
        } else {
          mostrarHorario(datos);
        }
      } catch (error) {
        mostrarError("No se pudo contactar el servicio.");
      } finally {
        boton.disabled = false;
        boton.textContent = "Generar horario";
      }
    });

    function mostrarError(mensaje) {
      const div = document.createElement("div");
      div.className = "estado mal";
      div.textContent = mensaje;
      salida.replaceChildren(div);
    }

    function mostrarHorario(datos) {
      const estado = document.createElement("div");
      estado.className = "estado " + (datos.valido ? "ok" : "mal");
      estado.textContent = datos.valido
        ? `Horario válido, encontrado en ${datos.generaciones} generaciones.`
        : `El mejor horario encontrado tiene ${datos.violaciones.violaciones} violaciones.`;

      const tabla = document.createElement("table");
      tabla.innerHTML = "<tr><th>Día</th><th>Jornada</th><th>Personas</th></tr>";
      for (const turno of datos.horario) {
        const fila = tabla.insertRow();
        for (const valor of [turno.dia, turno.jornada, turno.personas.join(", ")]) {
          fila.insertCell().textContent = valor;
        }
      }

      const totales = document.createElement("table");
      totales.innerHTML = "<tr><th>Persona</th><th>Turnos</th></tr>";
      for (const [nombre, n] of Object.entries(datos.turnos_por_persona)) {
        const fila = totales.insertRow();
        fila.insertCell().textContent = nombre;
        fila.insertCell().textContent = n;
      }

      salida.replaceChildren(estado, tabla, totales);
    }
  </script>
</body>
</html>
